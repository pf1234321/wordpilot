# Test-only overrides for writing-storage. Real runtime config lives in writing-start.

# ES Bean 仅用于满足 @ComponentScan；JPA 测试不会真正连接 ES.
elasticsearch.uris=http://127.0.0.1:9200

# 关闭 ES 自动配置（保留 Redis，lettuce 懒连，启动不报错）
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

# Redis：本地服务地址，@Tag("integration") 测试才真连；JPA 测试不触 Redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# 显式 H2 + ddl-auto=create-drop
spring.datasource.url=jdbc:h2:mem:writing_storage_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 强制 SQL 打到 stdout
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.main.banner-mode=off
