spring:
  application:
    name: wordpilot

  profiles:
    active: dev

  # JDK 21 虚拟线程：适配 SSE 长连接高并发
  threads:
    virtual:
      enabled: true

  # ======================== 数据源 ========================
  datasource:
    url: jdbc:mysql://127.0.0.1:3309/wordpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 数据库密码走环境变量（H4 全局不变量③），禁止明文入版本库；启动期缺则报错
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ======================== JPA ========================
  jpa:
    hibernate:
      # 开发环境自动建表；生产环境（profile=prod）设为 none，手动执行 SQL
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50

  # ======================== Redis ========================
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

# ======================== Elasticsearch 7 ========================
elasticsearch:
  uris: http://127.0.0.1:9200
  username: ""
  password: ""
  index:
    # ES 索引：dim=1024（bge-m3），检索 similarity=cosine
    material_chunk: writing_material_chunk

# ======================== HTTP Server ========================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # SSE 长连接需要更长超时
  tomcat:
    connection-timeout: 60s

# ======================== 模型服务 ========================
model:
  llm:
    provider: dashscope
    # DashScope API key 走环境变量（H4 全局不变量③），禁止明文入版本库；启动期缺则报错
    api_key: ${DASHSCOPE_API_KEY}
    base-url: https://dashscope.aliyuncs.com
    model: qwen-max
    timeout-seconds: 60
  embedding:
    provider: bge
    # BGE 模型本地路径走环境变量（H4 全局不变量③），禁止明文入版本库；启动期缺则报错
    model-path: ${BGE_MODEL_PATH}
    model: bge-m3
    dim: 1024
    load-on-start: true

# ======================== 记忆 ========================
memory:
  short-term:
    # 短期记忆默认最近 10 轮；超长用 AutoContextMemory 压缩
    max-rounds: 10
  long-term:
    # Agent 用 save_memory 工具回写，对话开始注入
    enabled: true

# ======================== 业务参数 ========================
material:
  chunk:
    # 切片参数：长度 / 重叠，可调优
    length: 500
    overlap: 50
  upload:
    max-size-mb: 50
    allowed-types: pdf,docx,txt,md

# ======================== Actuator + Prometheus ========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ======================== SpringDoc OpenAPI ========================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ======================== 日志 ========================
logging:
  level:
    root: INFO
    com.scriptagent: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%ex"
